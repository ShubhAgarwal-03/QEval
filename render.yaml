services:
  - type: web
    name: question-eval-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: question-eval-db
          property: connectionString
      - key: QUESTIONS_SEED_PATH
        value: data/questions_seed.json
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel URL after the frontend is deployed
      - key: ADMIN_API_KEY
        sync: false # set to a long random secret - protects /admin/questions

databases:
  - name: question-eval-db
    plan: free